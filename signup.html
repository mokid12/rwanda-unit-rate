<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | RWANDA UNIT RATE</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="auth.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="navbar-container">
    <nav class="navbar">
      <div class="navbar-left">
        <a href="index.html" class="logo">
          <span class="logo-icon">🏗️</span>
          <span class="logo-text">RWANDA UNIT RATE</span>
        </a>
      </div>
      <div class="navbar-center">
        <a href="index.html" class="nav-link">Home</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="login.html" class="nav-link">Login</a>
        <a href="signup.html" class="nav-link active">Sign Up</a>
      </div>
      <div class="navbar-right"></div>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-heading">
        <p class="eyebrow">Create account</p>
        <h1>Sign up today</h1>
        <p>Get access to Rwanda construction pricing tools.</p>
      </div>

      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label for="fullname">Full name</label>
          <input type="text" id="fullname" name="fullname" placeholder="John Doe" required />
        </div>

        <div class="form-group">
          <label for="signupEmail">Email address</label>
          <input type="email" id="signupEmail" name="email" placeholder="example@email.com" required />
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" name="password" placeholder="Create a strong password" required />
        </div>

        <p id="signupMessage" class="form-message" aria-live="polite"></p>
        <button type="submit" class="form-button">Create Account</button>
      </form>

      <p class="auth-footer">
        Already have an account?
        <a href="login.html">Login here</a>
      </p>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 RWANDA UNIT RATE. All Rights Reserved.</p>
    </div>
  </footer>
</body>
</html>
