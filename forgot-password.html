<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | RWANDA UNIT RATE</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="auth.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="navbar-container">
    <nav class="navbar">
      <div class="navbar-left">
        <a href="index.html" class="logo">
          <span class="logo-icon">🏗️</span>
          <span class="logo-text">RWANDA UNIT RATE</span>
        </a>
      </div>
      <div class="navbar-center">
        <a href="index.html" class="nav-link">Home</a>
        <a href="login.html" class="nav-link">Login</a>
      </div>
      <div class="navbar-right"></div>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-heading">
        <p class="eyebrow">Password reset</p>
        <h1>Forgot your password?</h1>
        <p>Enter your email and we'll send you a reset link.</p>
      </div>

      <form id="forgotPasswordForm" class="auth-form">
        <div class="form-group">
          <label for="resetEmail">Email address</label>
          <input type="email" id="resetEmail" placeholder="example@email.com" required />
        </div>
        <p id="forgotPasswordMessage" class="form-message"></p>
        <button type="submit" class="form-button">Send Reset Link</button>
      </form>

      <p class="auth-footer">Back to <a href="login.html">Login</a></p>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 RWANDA UNIT RATE. All Rights Reserved.</p>
    </div>
  </footer>
</body>
</html>
